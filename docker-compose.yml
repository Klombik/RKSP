version: "3.9"

services:
  app:
    build: .
    container_name: food-diary-app
    ports:
      - "8080:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      APP_HOST: localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/food_diary
      DB_SSL: "false"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: food-diary-db
    environment:
      POSTGRES_DB: food_diary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data: